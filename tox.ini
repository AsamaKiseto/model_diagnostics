# 在 Linux CPU 环境复现声明范围两端的 Python/PyTorch portable contract。
[tox]
min_version = 4.20
env_list =
    py310-torch25
    py311-torch25
    py312-torch25
    py310-torch210
    py311-torch210
    py312-torch210
skip_missing_interpreters = false

[testenv]
package = skip
description = portable contract with {base_python} and {env_name}
deps =
    pytest>=8,<10
commands_pre =
    torch25: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
    torch210: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
    python -m pip install --no-deps -e {tox_root}
commands =
    python -m pytest -q -c pytest.ini tests/base tests/extensions tests/host_runtime tests/release --ignore=tests/base/test_distribution.py --basetemp={tox_root}/.cache/pytest/{env_name} -k "not scale_benchmark"
set_env =
    PYTHONDONTWRITEBYTECODE = 1
    PYTHONNOUSERSITE = 1

[testenv:build]
description = build wheel and sdist from the independent source root
package = skip
deps =
    build>=1.2,<2
commands =
    python -m build --wheel --sdist --outdir {tox_root}/dist
